services:
  nginx:
    image: nginx:alpine
    restart: always
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - nextjs
      - user-service
      - torrent-service

  nextjs:
    build: ./frontend
    restart: always
    # Port 3000 is internal, reached through nginx only.

  user-service:
    build: ./user-service
    restart: always
    env_file:
      - .env
    volumes:
      - user_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --proxy-headers

  torrent-service:
    build: ./torrent-service
    restart: always
    env_file:
      - .env
    volumes:
      - torrent_media:/data/media
      - torrent_subtitles:/data/subtitles
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --proxy-headers

  db:
    image: postgres:16
    restart: always
    env_file:
      - .env
    # No published port: only the two services on the compose network reach it.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
  user_uploads:
  torrent_media:
  torrent_subtitles:
