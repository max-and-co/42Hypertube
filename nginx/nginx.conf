events {}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;
    server_tokens off;

    # Brute-force protection on the forms that check a password or send mail.
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_status 429;

    server {
        listen 80;
        client_max_body_size 2m;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ── User Service ─────────────────────────────────────────────────────

        location ~ ^/api/auth/(login|register|forgot-password|reset-password)$ {
            limit_req zone=auth burst=10 nodelay;
            set $user_svc user-service;
            rewrite ^/api/auth/(.*)$ /$1 break;
            proxy_pass http://$user_svc:8000;
        }

        # Auth routes: /api/auth/session → GET /session at user-service
        location /api/auth/ {
            set $user_svc user-service;
            rewrite /api/auth/(.*) /$1 break;
            proxy_pass http://$user_svc:8000;
        }

        location = /api/oauth/token {
            limit_req zone=auth burst=10 nodelay;
            set $user_svc user-service;
            rewrite ^ /token break;
            proxy_pass http://$user_svc:8000;
        }

        # OAuth browser routes: /api/oauth/42/login → GET /42/login
        location /api/oauth/ {
            set $user_svc user-service;
            rewrite /api/oauth/(.*) /$1 break;
            proxy_pass http://$user_svc:8000;
        }

        # User routes (with and without trailing slash):
        #   /api/users      → GET /   (user listing)
        #   /api/users/123  → GET /123
        location /api/users {
            set $user_svc user-service;
            rewrite /api/users/?(.*) /$1 break;
            proxy_pass http://$user_svc:8000;
        }

        # Movie routes: /api/movies → /movies, /api/movies/123 → /movies/123
        location /api/movies {
            set $user_svc user-service;
            rewrite ^/api/movies(.*)$ /movies$1 break;
            proxy_pass http://$user_svc:8000;
            proxy_read_timeout 90s;
        }

        # Comment routes: /api/comments → /comments, /api/comments/123 → /comments/123
        location /api/comments {
            set $user_svc user-service;
            rewrite ^/api/comments(.*)$ /comments$1 break;
            proxy_pass http://$user_svc:8000;
        }

        # ── Torrent Service ──────────────────────────────────────────────────

        location /api/torrent/ {
            set $torrent_svc torrent-service;
            rewrite /api/torrent/(.*) /$1 break;
            proxy_pass http://$torrent_svc:8001;
        }
        # Video bytes: unbuffered, and patient - a range the download has not
        # reached yet is held open until its pieces arrive.
        location /api/stream/ {
            set $torrent_svc torrent-service;
            rewrite /api/stream/(.*) /stream/$1 break;
            proxy_pass http://$torrent_svc:8001;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
        }
        location /api/subtitles/ {
            set $torrent_svc torrent-service;
            rewrite /api/subtitles/(.*) /subtitles/$1 break;
            proxy_pass http://$torrent_svc:8001;
        }

        # Any other /api path is not part of the API.
        location /api/ {
            default_type application/json;
            return 404 '{"detail":"Not Found"}';
        }

        # ── Frontend (Next.js) ───────────────────────────────────────────────

        location / {
            set $next_svc nextjs;
            proxy_pass http://$next_svc:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
